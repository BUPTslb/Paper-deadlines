# Only official conference/CFP pages belong here. Patterns must include a named
# `date` group and enough surrounding label text to identify a paper deadline.
sources:
  - id: cvpr27
    url: https://cvpr.thecvf.com/Conferences/2027/Dates
    set:
      place: Seattle, WA, USA
      date: June 20-25, 2027
      note: CCF A. Paper registration (abstract) due November 10, 2026 AoE; supplementary materials due November 23, 2026 AoE.
    abstract_deadline:
      pattern: "Paper Registration Deadline\\s*(?P<date>[A-Z][a-z]{2,8} \\d{1,2} '\\d{2})"
      formats: ["%b %d '%y"]
    deadline:
      pattern: "Submission Deadline\\s*(?P<date>[A-Z][a-z]{2,8} \\d{1,2} '\\d{2})"
      formats: ["%b %d '%y"]

  - id: iclr27
    url: https://iclr.cc/Conferences/2027/CallForPapers
    set:
      link: https://iclr.cc/Conferences/2027/CallForPapers
      place: California, USA
      date: April 26-30, 2027
      note: CCF A.
    abstract_deadline:
      pattern: "Abstract deadline\\s*[:|-]?\\s*(?P<date>[A-Z][a-z]{2,8} \\d{1,2},? 20\\d{2})"
      formats: ["%b %d, %Y", "%b %d %Y", "%B %d, %Y", "%B %d %Y"]
    deadline:
      pattern: "Paper deadline\\s*[:|-]?\\s*(?P<date>[A-Z][a-z]{2,8} \\d{1,2},? 20\\d{2})"
      formats: ["%b %d, %Y", "%b %d %Y", "%B %d, %Y", "%B %d %Y"]

  - id: dac27
    url: https://dac.com/2027/events/submission-deadline
    set:
      place: San Jose, CA, USA
      date: July 11-14, 2027
      note: CCF A. Abstract due November 11, 2026 5 PM PST; manuscript deadline November 18, 2026 5 PM PST (originally listed as November 17).
    abstract_deadline:
      pattern: "Abstract Submission Deadline \\(5 PM PST\\)\\s*(?P<date>[A-Z][a-z]{2,8} \\d{1,2},? 20\\d{2})"
      formats: ["%b %d, %Y", "%b %d %Y", "%B %d, %Y", "%B %d %Y"]
      time: "17:00:00"
    deadline:
      pattern: "Manuscript Submission Deadline \\(5 PM PST\\)\\s*(?P<date>[A-Z][a-z]{2,8} \\d{1,2},? 20\\d{2})"
      formats: ["%b %d, %Y", "%b %d %Y", "%B %d, %Y", "%B %d %Y"]
      time: "17:00:00"

  - id: isca27
    url: https://www.iscaconf.org/
    deadline:
      pattern: "(?:Full )?Paper (?:Submission )?Deadline\\s*[:|-]?\\s*(?P<date>[A-Z][a-z]{2,8} \\d{1,2},? 20\\d{2})"
      formats: ["%b %d, %Y", "%b %d %Y", "%B %d, %Y", "%B %d %Y"]
